<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recent Notes — Scattered Thoughts</title>
  </head>
  <body class="history-page">
    <main class="history-shell">
      <header class="history-header">
        <h1>Recent Notes</h1>
        <div class="history-file-actions">
          <button id="export-notes" type="button">Export</button>
          <button id="backup-database" type="button">Back up</button>
        </div>
      </header>
      <label class="sr-only" for="note-search">Search notes</label>
      <input id="note-search" type="search" placeholder="Search all notes" autocomplete="off" />
      <p id="history-status" class="status" aria-live="polite"></p>
      <div id="notes" class="notes" aria-live="polite"></div>
    </main>
    <dialog id="delete-note-dialog" class="confirm-dialog">
      <form method="dialog">
        <p id="delete-note-message">Delete this note permanently?</p>
        <div class="dialog-actions">
          <button id="cancel-delete" value="cancel" type="button">Cancel</button>
          <button id="confirm-delete" value="delete" type="button">Delete</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./history-entry.ts"></script>
  </body>
</html>
