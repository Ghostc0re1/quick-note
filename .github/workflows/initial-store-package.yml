name: Build initial Store package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      MSIX_CHANNEL: store
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: microsoft/setup-WinAppCli@v0.2
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run rust:fmt
      - run: npm run rust:clippy
      - run: npm run rust:test
      - run: npm run msix:package
      - uses: actions/upload-artifact@v4
        with:
          name: initial-store-msix
          path: artifacts/*.msix
          retention-days: 14
