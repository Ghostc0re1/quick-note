name: Release to Microsoft Store

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: microsoft-store
    env:
      MSIX_CHANNEL: store
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: microsoft/setup-WinAppCli@v0.2
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - run: npm ci
      - shell: pwsh
        run: |
          $tagRef = "refs/tags/$env:GITHUB_REF_NAME"
          git fetch --force origin "+${tagRef}:${tagRef}"
          if ((git cat-file -t $tagRef) -ne "tag") {
            throw "Store releases require an annotated tag."
          }
          npm run version:check -- --tag $env:GITHUB_REF_NAME
          $notes = git for-each-ref $tagRef --format="%(contents:body)"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Store releases require a non-empty annotated tag body for release notes."
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-notes.md"),
            $notes.Trim() + [Environment]::NewLine
          )
      - run: npm run check
      - run: npm run test
      - run: npm run rust:fmt
      - run: npm run rust:clippy
      - run: npm run rust:test
      - run: npm run msix:package
      - uses: actions/upload-artifact@v4
        with:
          name: store-release
          path: |
            artifacts/*.msix
            release-notes.md
          retention-days: 7
      - shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ vars.MSSTORE_SELLER_ID || secrets.SELLER_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_PRODUCT_ID)) {
            throw "MSSTORE_PRODUCT_ID repository variable is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:SELLER_ID)) {
            throw "MSSTORE_SELLER_ID Actions variable or SELLER_ID Actions secret is required."
          }
          $package = Get-ChildItem artifacts -Filter *.msix | Select-Object -First 1
          if ($null -eq $package) {
            throw "No MSIX package was created."
          }
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          msstore publish $package.FullName -id $env:MSSTORE_PRODUCT_ID
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --title "Scattered Thoughts $env:GITHUB_REF_NAME" --notes-file release-notes.md
