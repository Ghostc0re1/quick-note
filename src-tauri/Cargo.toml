[package]
name = "quick-note"
version = "0.1.0"
description = "A local-first tray app for quick notes"
authors = ["Scattered Thoughts contributors"]
edition = "2021"

[lib]
name = "quick_note_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["ApplicationModel", "Storage", "Storage_Search", "Win32_Foundation", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3.23.0"
